[project]
name = "asif"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "dingyi", email = "dingyixxx@126.com" }
]
requires-python = ">=3.13"
dependencies = [
    "base>=0.0.0",
    "booktype>=1.5",
    "fastapi>=0.141.1",
    "jieba3k>=0.35.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "notebook>=7.6.2",
    "ollama>=0.6.2",
    "preprocess>=2.0.0",
    "pymilvus>=3.0.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "streamlit>=1.62.0",
]

[project.scripts]
asif = "asif:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
